name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Experiment pipeline smoke run (tiny sizes)
        run: python scripts/run_experiments.py --quick --device cpu --out ci-run
      - name: Tables and figures from the smoke run
        run: |
          python scripts/make_tables.py ci-run/results/results.json > /dev/null
          python scripts/make_figures.py ci-run
