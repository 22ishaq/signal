[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amc"
version = "0.1.0"
description = "Automatic modulation classification from raw I/Q: a CNN against classical cumulant baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["amc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
